root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main -f etc/config.yaml"
full_bin = ""
include_ext = ["go", "yaml", "yml", "json", "toml"]
exclude_dir = ["tmp", "vendor", ".git", ".idea"]
exclude_file = []
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "cyan"
watcher = "yellow"
build = "green"
runner = "magenta"

[misc]
clean_on_exit = true
